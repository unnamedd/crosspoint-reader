name: CI (build)

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install clang-format-21
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get update
          sudo apt-get install -y clang-format-21

      - name: Run clang-format
        run: |
          PATH="/usr/lib/llvm-21/bin:$PATH" ./bin/clang-format-fix
          git diff --exit-code || (echo "Please run 'bin/clang-format-fix' to fix formatting issues" && exit 1)

  rust:
    name: Rust (format, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      # rust-toolchain.toml pins the version and lists rustfmt, clippy and the
      # RISC-V target, so rustup installs exactly that on the first cargo call.
      - name: Install Rust
        run: rustup show active-toolchain

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Format
        run: cargo fmt --check

      # The framework must stay device-generic: no product-specific code.
      - name: Check framework has no CrossPoint code
        run: |
          if grep -rniE "crosspoint|xteink" lib/xpui_rs/src/; then
            echo "xpui must not reference CrossPoint or Xteink" >&2
            exit 1
          fi

      # -D warnings covers clippy's lints and rustc's alike, so an unused import
      # fails the job exactly as a correctness lint does. There are no external
      # crates, so this can never be tripped by somebody else's code.
      - name: Lint (host)
        run: cargo clippy --workspace --all-targets --features xpui-rs/testing -- -D warnings

      # The step above compiles for the host, where `cfg(target_os = "none")` is
      # false — the global allocator and the panic handler are never even parsed.
      # Linting the device target is the only way those reach CI before a
      # firmware build does. ESP32-C3 stands in for the S3 too: same cfg, and no
      # build-std needed.
      - name: Lint (ESP32-C3, the firmware target)
        run: |
          cargo clippy --release --package crosspoint_rs \
            --target riscv32imc-unknown-none-elf -- -D warnings

      - name: Test
        run: cargo test --workspace --features xpui-rs/testing

  cppcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Run cppcheck
        run: pio check --fail-on-defect low --fail-on-defect medium --fail-on-defect high

  build-default:
    name: Build default
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      # The firmware links a Rust staticlib, so the toolchain must be present or
      # the build fails at the cargo step. `default` is ESP32-C3 (RISC-V), which
      # stable Rust targets: rustup installs the pin and the target from
      # rust-toolchain.toml on first use, so nothing has to be installed here.
      # The Xtensa fork is NOT needed by this job — see build-sticky.
      - name: Cache Rust toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-riscv-${{ runner.os }}-${{ hashFiles('**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: rust-riscv-${{ runner.os }}-

      - name: Build default firmware
        run: |
          set -euo pipefail
          pio run -e default | tee pio.log

      # scripts/report_memory.py already fails the build on a budget breach; this
      # only surfaces the figures. It reads the memory.json each environment
      # writes rather than scraping the log: the ESP32 build links twice, so the
      # log holds two different figures per environment and the first is a
      # partial image.
      - name: Extract firmware stats
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib

          print("## Firmware size\n")
          print("| Environment | Flash | Static RAM | of which Rust |")
          print("|---|---|---|---|")

          # Only what this job builds. sticky is a separate job with its own
          # summary, and listing it here could only ever print n/a.
          for env_name in ("default",):
              path = pathlib.Path(".pio/build") / env_name / "memory.json"
              if not path.exists():
                  print(f"| {env_name} | n/a | n/a | n/a |")
                  continue
              d = json.loads(path.read_text())
              fmt = lambda v: f"{v:,} B" if isinstance(v, int) else "n/a"
              print(
                  f"| {env_name} | {fmt(d['flash'])} | {fmt(d['static_ram'])} "
                  f"| {fmt(d['rust_flash'])} |"
              )

          print("\nStatic RAM is `.data/.bss/.noinit` only, not the heap.")
          print("Budgets live in `memory-budget.json`.")
          PY

      - name: Upload firmware.bin artifact
        uses: actions/upload-artifact@v6
        with:
          name: firmware.bin
          path: .pio/build/default/firmware.bin
          if-no-files-found: error

      # Needed to attribute a size regression to a library; CI previously kept
      # no map, so a PR had nothing to diff against.
      - name: Upload link maps
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: firmware-maps
          path: .pio/build/*/firmware.map
          if-no-files-found: warn

  build-sticky:
    name: Build sticky
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      # sticky is ESP32-S3, which is Xtensa. No stable Rust targets Xtensa, so
      # this is the one environment needing the esp-rs fork: scripts/build_rust.py
      # runs `cargo +esp ... -Z build-std=core,alloc` for it. Without this the
      # build dies with "toolchain 'esp' is not installed".
      #
      # esp-rs's own action rather than `cargo install espup && espup install`,
      # which would compile espup from source on every cache miss. This is what
      # esp-rs use in their CI. ldproxy is for cargo-driven linking; PlatformIO
      # does the link here, so it is not needed.
      # Pinned, like rust-toolchain.toml pins the stable one: the action defaults
      # to `latest`, and a silently newer compiler is a silently different
      # firmware binary. 1.95.0.0 is also what clippy.toml records as the msrv.
      - uses: esp-rs/xtensa-toolchain@v1.6
        with:
          version: "1.95.0.0"
          buildtargets: esp32s3
          ldproxy: false

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-esp-${{ runner.os }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: cargo-esp-${{ runner.os }}-

      - name: Build sticky firmware
        run: |
          set -euo pipefail
          pio run -e sticky | tee pio.log

      - name: Extract firmware stats
        run: |
          set -euo pipefail
          ram_line="$(grep -E "RAM:\\s" -m1 pio.log || true)"
          flash_line="$(grep -E "Flash:\\s" -m1 pio.log || true)"
          echo "ram_line=${ram_line}" >> "$GITHUB_OUTPUT"
          echo "flash_line=${flash_line}" >> "$GITHUB_OUTPUT"
          {
            echo "## Sticky firmware build stats"
            if [ -n "$ram_line" ]; then echo "- ${ram_line}"; else echo "- RAM: not found"; fi
            if [ -n "$flash_line" ]; then echo "- ${flash_line}"; else echo "- Flash: not found"; fi
          } >> "$GITHUB_STEP_SUMMARY"

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Cache googletest source
        uses: actions/cache@v4
        with:
          path: build/test/_deps/googletest-src
          key: ${{ runner.os }}-googletest-${{ hashFiles('test/CMakeLists.txt') }}

      - name: Configure
        run: cmake -S test -B build/test -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/test

      - name: Run tests
        run: ctest --test-dir build/test --output-on-failure -j

  # This job is used as the PR required actions check, allows for changes to other steps in the future without breaking
  # PR requirements.
  test-status:
    name: Test Status
    needs:
      - build-default
      - build-sticky
      - clang-format
      - cppcheck
      - rust
      - unit-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail because needed jobs failed
        # Fail if any job failed or was cancelled (skipped jobs are ok)
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - name: Success
        run: exit 0
